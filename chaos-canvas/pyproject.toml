[project]
name = "chaos-canvas"
version = "0.1.0"
description = "Learning math through generative art — one iteration at a time."
readme = "README.md"
authors = [
    { name = "Vinod", email = "vinodanbalagan@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    # Core math + plotting
    "numpy>=2.0",
    "matplotlib>=3.9",
    "scipy>=1.14",
    "pillow>=10.0",
    # Animations
    "imageio>=2.34",
    "imageio-ffmpeg>=0.5",
    # 3D plotting
    "plotly>=5.22",
    # Marimo with recommended extras
    "marimo[recommended]>=0.9",
    # JIT compilation for large IFS computations
    "numba>=0.60",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88

[tool.mypy]
strict = true
